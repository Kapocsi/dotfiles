# xsecurelock-ish hyprlock

general {
  hide_cursor = true
  grace = 0
  immediate_render = true
  fail_timeout = 2000
}

# Blurred screenshot background + dim
background {
  monitor =
  path = screenshot
  blur_passes = 3
  blur_size = 8
  noise = 0.02
  contrast = 0.95
  brightness = 0.65
  vibrancy = 0.05
  vibrancy_darkness = 0.0
}

# A subtle dark overlay so the blur is not too “busy”
shape {
  monitor =
  size = 100%, 100%
  color = rgba(0, 0, 0, 0.35)
  position = 0, 0
  halign = center
  valign = center
  zindex = 0
}

# Center “pill” backdrop (xsecurelock-style minimal prompt area)
shape {
  monitor =
  size = 520, 88
  color = rgba(0, 0, 0, 0.35)
  rounding = 22
  position = 0, -10
  halign = center
  valign = center
  zindex = 1
}

# Password field
input-field {
  monitor =
  size = 520, 88
  rounding = 22
  outline_thickness = 2

  # xsecurelock-ish: indicator rather than dots
  hide_input = true

  # colors
  inner_color = rgba(0, 0, 0, 0.0)
  outer_color = rgba(255, 255, 255, 0.20)
  font_color  = rgba(255, 255, 255, 0.92)

  # feedback accents
  check_color = rgba(255, 255, 255, 0.60)
  fail_color  = rgba(220,  80,  80, 0.85)
  capslock_color = rgba(255, 180,  60, 0.90)

  placeholder_text = <span foreground="##e6e6e6">Password</span>
  fail_text = <span foreground="##ff8080">$FAIL <b>($ATTEMPTS)</b></span>

  fade_on_empty = false
  position = 0, -10
  halign = center
  valign = center
  zindex = 2
}

# Small status line (layout + caps hint)
label {
  monitor =
  text = "$PAMPROMPT"
  font_size = 14
  position = 0, -80
  halign = center
  valign = center
  zindex = 2
}

# Time (subtle, like xsecurelock’s unobtrusive feel)
label {
  monitor =
  text = cmd[update:1000] date +"%H:%M"
  font_size = 54
  position = 0, 120
  halign = center
  valign = center
  zindex = 2
}
